name: Prepare single soft bird chirp (one-time)
# Extract one short foreground call, with measured peak level

on:
  push:
    paths:
      - ".github/workflows/prepare-nature.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audio processor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Extract and check a single soft bird call
        run: python .github/scripts/prepare_nature.py
      - name: Commit only the three cues
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meditation/sounds/pepiement.mp3
          if git diff --cached --quiet; then
            echo "Audio unchanged"
          else
            git commit -m "assets: add isolated bird chirp"
            git push
          fi
